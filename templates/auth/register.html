{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;" class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), var(--violet)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: white; font-size: 1.5rem; box-shadow: var(--shadow-glow);">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 style="font-size: 1.6rem; color: var(--text-main);">Create Helix Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Register to access the Startup Operating System</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" data-validate="true">
        <div class="form-group">
            <label>Full Name</label>
            <div class="input-icon-wrapper">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" name="name" class="form-control" required placeholder="John Doe">
            </div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <div class="input-icon-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" class="form-control" required placeholder="johndoe">
            </div>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <div class="input-icon-wrapper">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" class="form-control" required placeholder="john@startup.com">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-icon-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
        </div>

        <div class="form-group">
            <label>Role</label>
            <div class="input-icon-wrapper">
                <i class="fa-solid fa-id-badge"></i>
                <select name="role" class="form-control">
                    <option value="founder">Founder</option>
                    <option value="employee">Employee</option>
                    <option value="investor">Investor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 0.5rem;">
            <i class="fa-solid fa-user-check"></i> Register Account
        </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--accent);">Sign In &rarr;</a>
    </div>
</div>
{% endblock %}
