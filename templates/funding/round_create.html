{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Initiate Funding Round</h2>
    <form method="POST" action="{{ url_for('funding.round_create') }}">
        <div class="form-group">
            <label>Startup</label>
            <select name="startup_id" class="form-control" required>
                {% for s in startups %}
                <option value="{{ s.startup_id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Round Type</label>
            <input type="text" name="round_type" class="form-control" required placeholder="Seed / Series A">
        </div>
        <div class="form-group">
            <label>Target Amount ($)</label>
            <input type="number" step="1000" name="target_amount" class="form-control" required placeholder="500000">
        </div>
        <button type="submit" class="btn btn-primary">Create Round</button>
    </form>
</div>
{% endblock %}
