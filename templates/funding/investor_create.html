{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2>Add New Investor</h2>
    <form method="POST" action="{{ url_for('funding.investor_create') }}">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required placeholder="Charlie Investor">
        </div>
        <div class="form-group">
            <label>Firm Name</label>
            <input type="text" name="firm_name" class="form-control" placeholder="Apex Ventures">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required placeholder="charlie@vc.com">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" placeholder="+1-555-0192">
        </div>
        <button type="submit" class="btn btn-primary">Save Investor</button>
    </form>
</div>
{% endblock %}
