{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Create New Task</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
        Add a milestone task to an existing startup project.
    </p>
    <form method="POST" action="{{ url_for('tasks.task_create') }}">
        <div class="form-group">
            <label>Project</label>
            <select name="project_id" class="form-control" required>
                {% for p in projects %}
                <option value="{{ p.project_id }}">{{ p.name }} ({{ p.startup_name or 'Startup' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Task Title</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. Build Connection Pool">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Task requirements or details..."></textarea>
        </div>
        <div class="form-group">
            <label>Assigned To</label>
            <select name="assigned_to" class="form-control">
                <option value="">-- Unassigned --</option>
                {% for u in users %}
                <option value="{{ u.user_id }}">{{ u.name }} ({{ u.email }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label>Priority</label>
                <select name="priority" class="form-control">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date" class="form-control">
            </div>
        </div>
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">Create Task</button>
            <a href="{{ url_for('tasks.tasks_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
