{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Task #{{ task.task_id }}</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
        Project: <strong>{{ task.project_name }}</strong>
    </p>
    <form method="POST" action="{{ url_for('tasks.task_edit', task_id=task.task_id) }}">
        <div class="form-group">
            <label>Task Title</label>
            <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3">{{ task.description or '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Assigned To</label>
            <select name="assigned_to" class="form-control">
                <option value="">-- Unassigned --</option>
                {% for u in users %}
                <option value="{{ u.user_id }}" {% if task.assigned_to == u.user_id %}selected{% endif %}>
                    {{ u.name }} ({{ u.email }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label>Status</label>
                <select name="status" class="form-control">
                    <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>Pending</option>
                    <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                    <option value="completed" {% if task.status in ['completed', 'done'] %}selected{% endif %}>Completed</option>
                </select>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority" class="form-control">
                    <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('tasks.project_detail', project_id=task.project_id) }}" class="btn btn-secondary">Back to Project</a>
        </div>
    </form>
</div>
{% endblock %}
