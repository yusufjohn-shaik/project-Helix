{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 2rem auto; border: 1px solid var(--border-color);">
    <div style="margin-bottom: 1.5rem;">
        <h2 style="margin: 0; font-size: 1.35rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-rocket" style="color: var(--primary);"></i> Register New Startup
        </h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
            Inserts a new record into STARTUPS (Strong Entity) and creates initial founder team allocation.
        </p>
    </div>

    <form method="POST" action="{{ url_for('startup.create_startup') }}">
        <div class="form-group">
            <label>Startup Name *</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. NovaCart, QuickLedger">
        </div>

        <div class="form-group">
            <label>Industry *</label>
            <input type="text" name="industry" class="form-control" required placeholder="e.g. FinTech, AgriTech, HealthTech, CleanTech">
        </div>

        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label>Founded Date</label>
                <input type="date" name="founded_date" class="form-control">
            </div>

            <div class="form-group">
                <label>Operational Status</label>
                <select name="status" class="form-control">
                    <option value="active" selected>Active</option>
                    <option value="planning">Planning</option>
                    <option value="closed">Closed</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Brief elevator pitch or venture summary..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
            <a href="{{ url_for('startup.list_startups') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Register Startup</button>
        </div>
    </form>
</div>
{% endblock %}
